; Pen Plotter Firmware — Melzi Creality (ATmega1284P)
;
; Flash via USB:     pio run -t upload
; Flash via SD card: pio run          (generates firmware.bin in this folder)
;                    → copy firmware.bin to root of FAT32 micro SD card
;                    → insert card, power on — bootloader flashes automatically

[env:melzi_creality]
platform  = atmelavr
board     = sanguino_atmega1284p
framework = arduino

upload_speed   = 115200
monitor_speed  = 115200

lib_deps =
    waspinator/AccelStepper @ ^1.64.0
    olikraus/U8g2 @ ^2.35.30
    arduino-libraries/Servo @ ^1.2.1

build_flags = -D ARDUINO_AVR_SANGUINO

; Auto-generate firmware.bin after every build (for SD card flashing)
extra_scripts = post:generate_bin.py
