; PenPlotter Firmware — Creality Ender-3 v4.2.2 (STM32F103RCT6)
;
; Flash via SD card (recommended):
;   pio run                     → generates firmware.bin in this folder
;   Copy firmware.bin to root of FAT32 micro SD, insert, power on
;
; Flash via USB (needs ST-Link or DFU):
;   pio run -t upload

[env:ender3_v422]
platform  = ststm32
board     = genericSTM32F103RC
framework = arduino

; STM32F103RC @ 72MHz, generic board
board_build.mcu         = stm32f103rct6
board_build.f_cpu       = 72000000L

; SD card via SDIO (onboard on v4.2.2)
; STM32SD library is part of the STM32duino core
build_flags =
    -D ARDUINO_ARCH_STM32
    -D STM32F1xx
    -D SERIAL_TX_BUFFER_SIZE=256
    -D SERIAL_RX_BUFFER_SIZE=256
    -I lib/Servo/src
    -I lib/EEPROM/src

upload_protocol = serial
upload_speed    = 115200
monitor_speed   = 115200

lib_deps =
    olikraus/U8g2 @ ^2.35.30
    waspinator/AccelStepper @ ^1.64.0
    greiman/SdFat @ ^2.2.0
